
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SDI College | Admission</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            justify-content:center;
            background-color: white;
            background: url("https://images.unsplash.com/photo-1789758489815-2f8db7ff9f62?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyMnx8fGVufDB8fHx8fA%3D%3D") no-repeat center center;
            background-size: cover;
            background-position: center;
            flex-wrap:wrap;
            display: flex; 
            
            
        }
        .admission{
            background-color: rgb(8, 8, 141);
            margin:10px;
            padding:10px;
            border: 1px solid rgb(33, 188, 202);
            align-items: center;
            width:600px;
            height:800px;
            border-radius: 20px;
        
        }

        .admission h2{
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        form{
            display: flex;
            flex-direction: column;
            margin:20px;
            padding: 20px;
            gap: 25px;
        }
        .form-group{
            position: relative;

        }
        .form-group input{
            width:100%;
            padding:15px;
            background: transparent;
            border-radius:10px;
            color:white;
            outline:none;
            transition:0.3s;
        }
        .form-group input:focus{
           box-shadow: 0px 0px 20px 5px rgb(44, 181, 194) ;
           border: 2px solid rgb(21, 160, 195);
        }
        .form-group label{
            left:15px;
            top:15px;
            color: white;
            transition:0.1s;
        }
        select{
            width:100%;
            height: 30px;
            border-radius:10px;
        }
        textarea{
            width:100%;
            height:100px;
            border-radius:10px;
            
        }
        textarea:focus{
            box-shadow: 0px 0px 20px 5px rgb(20, 174, 222) ;
            border: 2px solid rgb(17, 164, 222);
        }
        button{
            background-color: rgb(13, 220, 220);
            height:50px;
            border:2px solid rgb(13, 220, 220) ;
            border-radius:20px;
            font-size:large;
        }
        button:hover{
            background-color:rgb(8, 8, 141);
            box-shadow:0px 0px 20px 5px aqua;
            color: white;
            cursor: pointer;
        }
        .header{
            background: #082567;
            color: white;
            padding: 15px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            width:100%;
            top: 0;
            z-index: 1000;
        }
        
        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ffd700;
        }
        nav{
            height:80px;
            display:flex;
            align-items:center;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
            margin:40px 0px 0px 200px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #f8d405;
        }
         /* Footer */
        footer {
            background: #061a45;
            color: white;
            text-align: center;
            padding: 30px 15px;
            width:100%;
        }

        footer h2 {
            color: #ffd700;
            margin-bottom: 10px;
        }

        .social {
            margin: 15px 0;
        }

        .social a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        .social a:hover {
            color: #ffd700;
        }
            
        
        
    </style> 

</head>

<body>
    <header class="header">
        <nav>
           <p class="logo"> SDI <span>college</span> Bhadohi</p>
            <ul>
                <li><a href="#home">Home</a>  </li>
                <li><a href="#about">About</a> </li>
                <li><a href="#acedemic program">Academic program</a> </li>
                <li><a href="#facilities">Facilities</a>  </li>
                <li><a href="#notices">Notices</a>  </li>
                <li><a href="#faculty">Faculty</a>  </li>
                <li><a href="#admission">Admission</a>  </li>
            </ul>
        </nav>
    </header>
<section class="admission" id="admission">
        <h2 class="section-title">Admission Form</h2>

        <form onsubmit="submitForm(event)">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    
                    required
                >
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" required>
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="tel" placeholder="dd-mm-yyyy" required>
            </div>

            <div class="form-group" >
                <label>Select Course</label>

                <select required>
                    <option value="">-- Select class --</option>
                    <option>class 1</option>
                    <option>class 2</option>
                    <option>class 3</option>
                    <option>class 4</option>
                    <option>class 5</option>
                    <option>class 6</option>
                    <option>class 7</option>
                    <option>class 8</option>
                    <option>class 8</option>
                    <option>Highschool</option>
                    <option>class 11</option>
                    <option>Intermediate</option>
                </select>
            </div>

            <div class="form-group" id="message">
                <label>Message</label>

                <textarea
                    placeholder="Write your message"
                ></textarea>
            </div>

            <button type="submit">
                Submit Application
            </button>

        </form>
        </div>
    </section>
    <!-- Footer -->
    
    <footer>

        <h2>SDI COLLEGE</h2>

        <p>
            Empowering Students Through Quality Education
        </p>

        <div class="social">
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">YouTube</a>
            <a href="#">LinkedIn</a>
        </div>

        <p>
            © 2026 SDI College. All Rights Reserved. Developed by <b>Pradeep maurya</b>
        </p>

    </footer>
    

   
    <!-- JavaScript -->
    <script>

        function submitForm(event) {

            event.preventDefault();

            alert(
                "Thank you! Your admission application has been submitted successfully."
            );

        }

    </script>

</body>
</html>
